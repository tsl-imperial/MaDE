[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "made"
version = "0.1.0"
description = "Markovian Dynamics Enforcer: a frozen, plug-and-play correction layer that projects state-transition predictions onto a physically feasible manifold."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
  { name = "Kevin Yu" },
  { name = "Tao Guo" },
  { name = "Constantinos Antoniou" },
  { name = "Panagiotis Angeloudis" },
]
dependencies = [
  "jax>=0.4.30",
  "equinox>=0.11",
  "diffrax>=0.6",
  "optax>=0.2",
  "orbax-checkpoint>=0.9",
  "cloudpickle>=2.0",
  "numpy>=1.26",
  "tqdm>=4.66",
  "wandb>=0.18",
]

[project.optional-dependencies]
cuda12 = [
  "jax[cuda12]>=0.4.30; platform_system == 'Linux'",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
# Linux: versions used to produce the paper's results (CUDA 12, RTX 3090).
# macOS: versions the test suite was validated with on CPU. Random streams match across both,
# because made.utils.jax_setup.configure() fixes jax_threefry_partitionable=True.
constraint-dependencies = [
  "jax==0.10.0; sys_platform == 'linux'",
  "jaxlib==0.10.0; sys_platform == 'linux'",
  "jax-cuda12-plugin==0.10.0; sys_platform == 'linux'",
  "jax-cuda12-pjrt==0.10.0; sys_platform == 'linux'",
  "equinox==0.13.7; sys_platform == 'linux'",
  "diffrax==0.7.2",
  "optax==0.2.5",
  "orbax-checkpoint==0.11.5",
  "numpy==2.4.4; sys_platform == 'linux'",
  "jax==0.4.38; sys_platform == 'darwin'",
  "jaxlib==0.4.38; sys_platform == 'darwin'",
  "equinox==0.13.6; sys_platform == 'darwin'",
  "numpy==2.4.3; sys_platform == 'darwin'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/made"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
# Default invocation excludes the `slow` tier (end-to-end smokes, ~5 min wall).
# Run `pytest -m slow` to exercise it.
addopts = "-m 'not slow'"
markers = [
  "slow: mark test as part of the slow tier (end-to-end smokes, ~5 min wall)",
]
